name: Enterprise source snapshot
on:
  push:
    branches: [codex/enterprise-hardening-20261006]
    paths: [.github/workflows/enterprise-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export code and synthetic fixtures only
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          allowed_dirs = {'optimizer', 'scripts', 'tests', 'shared'}
          allowed_suffixes = {'.js', '.cjs', '.py', '.sh', '.cmd', '.css', '.html', '.md', '.txt', '.json', '.toml'}
          synthetic = {'data/routes-data-synthetic-v14.js', 'assets/demo/stct-synthetic-demo.json'}
          with zipfile.ZipFile('/tmp/enterprise-source.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
                  p = pathlib.Path(name)
                  if p.is_symlink() or not p.is_file():
                      continue
                  if 'uc' in p.name.lower() or 'laiyifen' in name.lower():
                      continue
                  keep = name in synthetic or (len(p.parts) == 1 and p.suffix in allowed_suffixes) or (p.parts[0] in allowed_dirs and p.suffix in allowed_suffixes) or (p.parts[:2] in [('vendor', 'maplibre'), ('vendor', 'xlsx')] and p.suffix in {'.js', '.css'})
                  if keep and name not in {'dispatch.html', 'test_maplibre.html', 'requirements-v17.json'}:
                      out.write(p, name)
              out.writestr('SOURCE_COMMIT.txt', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-source
          path: /tmp/enterprise-source.zip
          retention-days: 1
          if-no-files-found: error
