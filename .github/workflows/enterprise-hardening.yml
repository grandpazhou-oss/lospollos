name: Enterprise hardening checks
on:
  push:
    branches: [codex/enterprise-hardening-20261006, codex/enterprise-validation-20261006, codex/windows-handoff-map-showcase-20261005]
  pull_request:
    branches: [main, codex/enterprise-hardening-20261006, codex/windows-handoff-map-showcase-20261005]
permissions:
  contents: read
concurrency:
  group: enterprise-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Core contracts, build pin, storage and admission regression
        shell: bash
        run: python scripts/run_enterprise_checks.py --mode core --output "$RUNNER_TEMP/enterprise-core"
      - name: Verify checked-out source stayed unchanged
        if: always()
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-core-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-core
          retention-days: 7
          if-no-files-found: warn
  native-browser:
    name: Native solver and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Dependencies only on the ephemeral hosted runner
        run: python -m pip install 'ortools==9.15.6755' 'playwright==1.57.0'
      - name: Real native solver and subprocess lifecycle
        run: python scripts/run_enterprise_checks.py --mode native --output "$RUNNER_TEMP/enterprise-native"
      - name: CI browser
        run: python -m playwright install --with-deps chromium
      - name: Native IndexedDB across two pages
        if: ${{ !cancelled() }}
        env:
          STCT_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/enterprise-browser
        run: python scripts/run_enterprise_checks.py --mode browser --output "$RUNNER_TEMP/enterprise-browser"
      - name: Synthetic DESIGN full UI and independent result review
        if: ${{ !cancelled() }}
        run: python tests/test_enterprise_synthetic_full_ui.py --evidence-dir "$RUNNER_TEMP/enterprise-full-ui"
      - name: Controlled UI faults and genuine native retries
        if: ${{ !cancelled() }}
        run: python tests/test_enterprise_ui_faults.py --evidence-dir "$RUNNER_TEMP/enterprise-ui-faults"
      - name: COMMAND dispatch, manual edits, apply and cancellation
        if: ${{ !cancelled() }}
        run: python tests/test_enterprise_command_ui.py --evidence-dir "$RUNNER_TEMP/enterprise-command-ui"
      - name: Verify checked-out source stayed unchanged
        if: always()
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-native-browser-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/enterprise-native
            ${{ runner.temp }}/enterprise-browser
            ${{ runner.temp }}/enterprise-full-ui
            ${{ runner.temp }}/enterprise-ui-faults
            ${{ runner.temp }}/enterprise-command-ui
          retention-days: 7
          if-no-files-found: warn
  stress-soak:
    name: Sustained native and browser load
    # Run once for an explicit validation-branch push, not again on its PR event.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/codex/enterprise-validation-20261006' }}
    needs: [core, native-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Existing approved dependencies on ephemeral hosted runner
        run: python -m pip install 'ortools==9.15.6755' 'playwright==1.57.0'
      - name: Verify runtime identity before sustained load
        run: python scripts/update_build_identity.py --check
      - name: Existing approved Chromium on ephemeral runner
        run: python -m playwright install --with-deps chromium
      - name: Native soak harness preflight (not a completed soak)
        id: native_smoke
        timeout-minutes: 5
        run: python tests/test_enterprise_native_soak.py --duration-seconds 90 --evidence-dir "$RUNNER_TEMP/enterprise-soak-preflight/native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-native-preflight-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-soak-preflight/native
          retention-days: 7
          if-no-files-found: warn
      - name: Fixed large native profile preflight (not a completed soak)
        id: native_fixed_smoke
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: python tests/test_enterprise_native_soak.py --workload-profile fixed-large --duration-seconds 90 --evidence-dir "$RUNNER_TEMP/enterprise-soak-preflight/native-fixed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-native-fixed-preflight-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-soak-preflight/native-fixed
          retention-days: 7
          if-no-files-found: warn
      - name: Browser soak harness preflight (not a completed soak)
        id: browser_smoke
        timeout-minutes: 5
        if: ${{ !cancelled() }}
        run: python tests/test_enterprise_browser_soak.py --memory-profile hosted-2gib --smoke --duration-seconds 0 --ui-cycles 1 --storage-cycles 10 --native-every 1 --evidence-dir "$RUNNER_TEMP/enterprise-soak-preflight/browser"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-soak-preflight-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-soak-preflight
          retention-days: 7
          if-no-files-found: warn
      - name: Thirty-one-minute fixed large native load without backend restart
        timeout-minutes: 36
        if: ${{ !cancelled() && steps.native_smoke.outcome == 'success' && steps.native_fixed_smoke.outcome == 'success' }}
        run: python tests/test_enterprise_native_soak.py --workload-profile fixed-large --duration-seconds 1860 --evidence-dir "$RUNNER_TEMP/enterprise-native-soak"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-native-fixed-soak-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-native-soak
          retention-days: 7
          if-no-files-found: warn
      - name: Twelve-minute isolated UI and native IndexedDB soak
        timeout-minutes: 16
        if: ${{ !cancelled() && steps.browser_smoke.outcome == 'success' }}
        run: python tests/test_enterprise_browser_soak.py --memory-profile hosted-2gib --duration-seconds 720 --evidence-dir "$RUNNER_TEMP/enterprise-browser-soak"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-browser-soak-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-browser-soak
          retention-days: 7
          if-no-files-found: warn
      - name: Three independent COMMAND UI repetition cycles
        timeout-minutes: 7
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for cycle in 1 2 3; do
            python tests/test_enterprise_command_ui.py --evidence-dir "$RUNNER_TEMP/enterprise-command-repeat/cycle-$cycle"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: enterprise-command-repeat-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/enterprise-command-repeat
          retention-days: 7
          if-no-files-found: warn
      - name: Verify stress checks did not rewrite source
        if: always()
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --exit-code HEAD --
