name: Apply reviewed backend hardening
on:
  push:
    branches: [codex/enterprise-hardening-20261006]
    paths: [.github/workflows/enterprise-backend-apply.yml]
permissions:
  contents: write
concurrency:
  group: enterprise-backend-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'grandpazhou-oss/lospollos' && github.ref == 'refs/heads/codex/enterprise-hardening-20261006'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          encoded = '''
          
          '''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '45ccde0883b55c6e2748ee9f69931a8fac2c13b93af7db393ef528099d436d5a', 'Patch digest mismatch'
          pathlib.Path('/tmp/backend.patch').write_bytes(patch)
          PY
          git apply --check /tmp/backend.patch
          git apply /tmp/backend.patch
          python3 scripts/update_build_identity.py --write
      - name: Validate before committing
        run: |
          python3 scripts/update_build_identity.py --check
          python3 tests/test_backend_build_fingerprint.py
          python3 tests/test_enterprise_backend_admission.py
          node --test tests/test_enterprise_hardening_v1.cjs
          node tests/test_enterprise_snapshot_integrity.js
          git diff --check
      - name: Push only the isolated branch with a head lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/enterprise-hardening-20261006 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitattributes README.md BUILD_IDENTITY.md CURRENT_STATE.md config.js optimizer/build_identity.py optimizer/build-manifest.json optimizer/ortools_service.py optimizer/supply_chain_jobs_v6.py scripts/local_trial.py scripts/update_build_identity.py tests/test_backend_build_fingerprint.py tests/test_enterprise_backend_admission.py
          git commit -m 'fix: unify solver admission and verify complete local runtime identity'
          ASKPASS="$RUNNER_TEMP/enterprise-askpass"
          printf '#!/bin/sh\ncase "$1" in *Username*) printf "x-access-token\\n" ;; *Password*) printf "%%s\\n" "$GH_TOKEN" ;; *) exit 1 ;; esac\n' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/codex/enterprise-hardening-20261006
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
